<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Content Security Policy: the browser refuses to load anything not listed here.
       To allow another image host, add it to img-src in every page. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com; media-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://www.instagram.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects</title>
  <meta name="description" content="Past video projects and clients.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="projects">
  <header class="site-header" id="site-header"></header>

  <main class="wrap">
    <div class="page-head">
      <h1>Projects</h1>
      <p>Past work and clients. Pick a category, then open a project to watch it and read about it.</p>
    </div>

    <div class="tabs" id="tabs" role="group" aria-label="Filter by category"></div>
    <div class="grid" id="project-grid"></div>
  </main>

  <!-- Popup: video on the left, title and description on the right -->
  <dialog class="modal" id="project-dialog" aria-labelledby="pd-title">
    <button class="close" type="button" data-close aria-label="Close">&times;</button>
    <div class="modal-grid">
      <div class="player" id="pd-player"></div>
      <div class="info">
        <p class="chip" id="pd-cat"></p>
        <h2 id="pd-title"></h2>
        <dl class="facts" id="pd-facts"></dl>
        <div class="prose" id="pd-desc"></div>
      </div>
    </div>
  </dialog>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
